# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
#
# Production Docker Compose orchestration for ProcureOps AI.
#
# Features:
# - Multi-stage, lean, non-root production images (Dockerfile.prod).
# - No development volume mounts or live reloads (--reload disabled).
# - Explicit database migration step (backend-migration service).
# - Healthchecks and robust service restart policies.
#
# Usage:
#   1. Run migrations:
#      docker compose -f docker-compose.prod.yml run --rm backend-migration
#   2. Start services:
#      docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Explicit Database Migration Runner ──────────────────────────────────────
  backend-migration:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - procureops_internal
    restart: "no"

  # ── Production FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      # Bound strictly to loopback (127.0.0.1); never exposed to 0.0.0.0.
      # Reverse proxy (Nginx, Caddy, Cloudflare tunnel) on the host proxies traffic here.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - WEB_CONCURRENCY=2
      - DEBUG=False
      - ENVIRONMENT=production
    volumes:
      # Only persistent uploads directory mounted; application code is baked into the image
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - procureops_internal
    restart: always

  # ── Production Next.js 15 Standalone Frontend ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      # Bound strictly to loopback (127.0.0.1); never exposed to 0.0.0.0.
      # Reverse proxy (Nginx, Caddy, Cloudflare tunnel) on the host proxies traffic here.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - procureops_internal
    restart: always

  # ── Asynchronous Email Outbox Worker ────────────────────────────────────────
  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["python", "-m", "app.services.email.worker", "--interval", "10", "--stuck-timeout", "300"]
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - procureops_internal
    restart: always

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    # ZERO host port publishing. PostgreSQL is consumed exclusively over the internal
    # Docker network (procureops_internal) by backend and migration services.
    # To run ad-hoc psql or administrative tasks from the host:
    #   docker compose -f docker-compose.prod.yml exec postgres psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procureops_internal
    restart: always

  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    # ZERO host port publishing. Vector search and ingestion are consumed exclusively
    # over the internal Docker network by the backend service.
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - procureops_internal
    restart: always

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # ZERO host port publishing. Cache and rate limiting are consumed exclusively
    # over the internal Docker network by the backend service.
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - procureops_internal
    restart: always

networks:
  procureops_internal:
    name: procureops_prod_network
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  backend_uploads:
