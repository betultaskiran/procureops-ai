# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
#
# Production Docker Compose orchestration for ProcureOps AI.
#
# Features:
# - Multi-stage, lean, non-root production images (Dockerfile.prod).
# - No development volume mounts or live reloads (--reload disabled).
# - Explicit database migration step (backend-migration service).
# - Healthchecks and robust service restart policies.
#
# Usage:
#   1. Run migrations:
#      docker compose -f docker-compose.prod.yml run --rm backend-migration
#   2. Start services:
#      docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Explicit Database Migration Runner ──────────────────────────────────────
  backend-migration:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Production FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WEB_CONCURRENCY=2
      - DEBUG=False
      - ENVIRONMENT=production
    volumes:
      # Only persistent uploads directory mounted; application code is baked into the image
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: always

  # ── Production Next.js 15 Standalone Frontend ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  backend_uploads:
