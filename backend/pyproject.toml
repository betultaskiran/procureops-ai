# ─────────────────────────────────────────────────────────────────────────────
# pyproject.toml — Python project metadata and dependencies
#
# This is the modern standard for Python projects (PEP 517/518).
# It replaces requirements.txt + setup.py.
#
# uv reads this file to install and manage dependencies.
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "procureops-backend"
version = "0.1.0"
description = "ProcureOps AI — Evidence-Backed Procurement Decision & Workflow Engine"
requires-python = ">=3.12"

# ─── Runtime dependencies ─────────────────────────────────────────────────────
# Every package here must have a reason. We will add more as phases progress.
dependencies = [
    # Web framework. Async by default, native Pydantic support, auto API docs.
    "fastapi>=0.115.0",

    # ASGI server. Runs FastAPI. [standard] includes websocket support + extras.
    "uvicorn[standard]>=0.30.0",

    # Data validation. We use this for API request/response schemas AND
    # for structured quote extraction (Phases 3+).
    "pydantic>=2.9.0",

    # Reads Pydantic models from environment variables and .env files.
    # Powers our Settings class in config.py.
    "pydantic-settings>=2.5.0",

    # PostgreSQL driver (synchronous). Kept for Alembic migration runner.
    # Alembic runs migrations synchronously — simpler and more reliable.
    "psycopg2-binary>=2.9.9",

    # HTTP client library (async). Used to ping Qdrant's REST health endpoint.
    "httpx>=0.27.0",

    # Redis Python client. Used for health check now; caching/queues in Phase 13.
    "redis>=5.1.0",

    # ORM. [asyncio] extra includes greenlet, required for async SQLAlchemy.
    "sqlalchemy[asyncio]>=2.0.35",

    # Async PostgreSQL driver. Used by SQLAlchemy for application queries.
    # We keep psycopg2 for Alembic migrations (sync) and asyncpg for app code (async).
    "asyncpg>=0.29.0",

    # Database migration tool. Tracks schema changes as versioned Python files.
    "alembic>=1.13.0",

    # Google Gemini SDK (new unified SDK — not the legacy google-generativeai).
    # Supports async, structured output, function calling, Vertex AI and Developer API.
    "google-genai>=1.0.0",

    # PDF text and table extraction. Best-in-class for structured supplier quotes.
    "pdfplumber>=0.11.0",

    # Excel spreadsheet (.xlsx) parsing for supplier quotations (Phase 8).
    "openpyxl>=3.1.2",

    # Required by FastAPI for UploadFile / multipart form data.
    # Without this, file upload endpoints silently fail.
    "python-multipart>=0.0.9",

    # Async file I/O. Used to save uploaded files without blocking the event loop.
    "aiofiles>=24.0.0",

    # RAG / Vector DB (Phase 5)
    "qdrant-client>=1.11.0",
    
    # BM25 Sparse Vector generation for Hybrid Search (Phase 7)
    "fastembed>=0.4.0",

    # Security & Authentication (Phase 5)
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.0.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# ─── Build system ─────────────────────────────────────────────────────────────
# hatchling is a modern, fast Python build backend.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Tool: ruff (linter + formatter) ─────────────────────────────────────────
# We're not enforcing this yet, but having the config ready is good practice.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort

# ─── Tool: pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
