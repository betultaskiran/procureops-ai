# alembic.ini
#
# Alembic konfigürasyon dosyası.
# "alembic upgrade head" gibi komutlar bu dosyayı okur.
#
# ÖNEMLİ: sqlalchemy.url burada bir placeholder.
# Gerçek URL env.py içinde environment variable'lardan okunur.
# Bu sayede credentials asla bu dosyaya yazılmaz.

[alembic]
# Migration script'lerinin bulunduğu klasör (backend/ dizinine göre relative)
script_location = alembic

# Migration dosyası adı formatı:
# %%(rev)s  → revision ID (kısa hash)
# %%(slug)s → migration mesajının slug hali
# Örnek: 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# Yeni migration dosyaları için Python kaynak kodlama
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
